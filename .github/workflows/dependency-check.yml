name: Análise de Dependências (OWASP)

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Executar dependency-check (falha em CVSS >= 7)
        working-directory: backend
        env:
          # Opcional: acelera o download da base NVD. Configure em Settings > Secrets.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Psecurity verify -DskipTests
      - name: Publicar relatório SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/target/dependency-check-report.sarif
        continue-on-error: true
      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          if-no-files-found: ignore
