name: Análise de Dependências

# Antes era o OWASP Dependency-Check. A versão 13 exige chave da API da NVD e
# recusa rodar sem ela, e mesmo com chave a base da NVD vive com limite de taxa
# e casamento por CPE, que acusa a biblioteca errada. O OSV lê as coordenadas
# exatas do SBOM e não pede chave. O perfil "security" do pom continua lá para
# quem quiser rodar o Dependency-Check com chave própria.

on:
  pull_request:
    branches: ["produção", "homologação"]
  push:
    branches: ["produção", "homologação"]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: Vulnerabilidades em dependências (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # Lendo o pom direto, o OSV não resolve as transitivas. O SBOM sai do
      # próprio Maven, com o que vai de fato para o jar.
      - name: Gerar o SBOM do back-end
        working-directory: backend
        run: mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DoutputName=bom.cdx
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            -L backend/target/bom.cdx.json
      - name: Guardar o SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-backend
          path: backend/target/bom.cdx.json
          if-no-files-found: ignore
