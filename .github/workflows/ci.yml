name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build e testes (unitários e de segurança)
        working-directory: backend
        # O teste de contexto completo (ReviewFlowIntegrationTest) depende de
        # infraestrutura (banco/mensageria) não provisionada neste gate e roda
        # em um job dedicado. Aqui rodam os testes unitários e de segurança.
        run: mvn -B verify -Dtest='!ReviewFlowIntegrationTest' -DfailIfNoTests=false
      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
