name: CI

on:
  push:
    branches: ["produção", "homologação"]
  pull_request:
    branches: ["produção", "homologação"]

permissions:
  contents: read

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build e testes
        working-directory: backend
        # Roda a suite inteira, incluindo o teste que sobe a aplicacao. Ele
        # deixou de exigir Docker: o Postgres e embutido pelo proprio teste e o
        # broker e substituido por um dublê. Antes essa classe era excluida
        # daqui, o que significava que o unico teste capaz de provar que as
        # pecas funcionam juntas nunca era executado.
        run: mvn -B verify
      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
