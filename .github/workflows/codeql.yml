name: Análise de Segurança CodeQL

on:
  push:
    branches: ["produção", "homologação"]
  pull_request:
    branches: ["produção", "homologação"]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  analyze:
    name: Análise CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          languages: java
          queries: security-and-quality

      - name: Configurar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build para análise
        working-directory: backend
        run: mvn compile -DskipTests -B

      - name: Executar análise CodeQL
        uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          category: "/language:java"
