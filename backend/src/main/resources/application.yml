spring:
  application:
    name: codereview-ai

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codereview}
    username: ${SPRING_DATASOURCE_USERNAME:codereview}
    password: ${SPRING_DATASOURCE_PASSWORD:codereview123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          max-interval: 30000
          multiplier: 3
          max-attempts: 3

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:codellama}
  timeout-minutes: ${OLLAMA_TIMEOUT_MINUTES:5}

review:
  rate-limit: ${REVIEW_RATE_LIMIT:20}
  rate-limit-window-hours: ${REVIEW_RATE_LIMIT_WINDOW_HOURS:1}
  max-lines: ${REVIEW_MAX_LINES:500}

jwt:
  secret: ${JWT_SECRET:bXlzdXBlcnNlY3JldGtleW15c3VwZXJzZWNyZXRrZXkxMjM0NTY3ODkwMTIzNA==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.fabriciojunio.codereview: INFO
    org.springframework.amqp: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
