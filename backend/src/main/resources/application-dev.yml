spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.fabriciojunio.codereview: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
