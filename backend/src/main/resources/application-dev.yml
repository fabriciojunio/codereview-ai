spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Chave usada APENAS em desenvolvimento local. Em produção, use JWT_SECRET via variável de ambiente.
  secret: "dev-only-jwt-secret-key-change-in-production-32c"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.fabriciojunio.codereview: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
